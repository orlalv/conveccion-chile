name: Capturas de prueba
on: workflow_dispatch
permissions:
  contents: write
jobs:
  capturas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Capturar páginas reales
        run: |
          mkdir c && cd c && npm init -y >/dev/null && npm i playwright@1.47.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          cat > cap.js <<'JS'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch();
          const P=[['visor_geo','https://satelite.metotec.cl/visor/',null],['visor_ir','https://satelite.metotec.cl/visor/','.p[data-k=ir]'],['visor_fuego','https://satelite.metotec.cl/visor/','.p[data-k=fuego]'],['visor_niebla','https://satelite.metotec.cl/visor/','.p[data-k=niebla]'],['visor_hd','https://satelite.metotec.cl/visor/','.p[data-k=hd]'],
                   ['incendios','https://satelite.metotec.cl/incendios/',null],['incendios_b7','https://satelite.metotec.cl/incendios/','#fondo=b7'],['estaciones','https://satelite.metotec.cl/incendios/estaciones.html','#radio=30'],['portada','https://metotec.cl/',null],['conveccion','https://satelite.metotec.cl/',null]];
          for (const [n,u,acc] of P){ const p=await b.newPage({viewport:{width:1400,height:850}}); const errs=[];
            p.on('pageerror',e=>errs.push(e.message)); p.on('console',m=>{if(m.type()==='error')errs.push(m.text())});
            try{ await p.goto(u,{waitUntil:'networkidle',timeout:60000}); await p.waitForTimeout(4000);
              if(acc){ if(acc.includes('=')){const [s,v]=acc.split('=');await p.selectOption(s,v);} else await p.click(acc); await p.waitForTimeout(6000);}
              await p.screenshot({path:n+'.png'}); }catch(e){errs.push('FALLO '+e.message)}
            console.log(n, errs.length?errs.slice(0,5).join(' | '):'sin errores'); await p.close(); }
          await b.close();})();
          JS
          node cap.js
          rm -rf node_modules package*.json cap.js
          git init -q -b capturas && git add . && git -c user.name=bot -c user.email=bot@metotec.cl commit -qm capturas
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" capturas
