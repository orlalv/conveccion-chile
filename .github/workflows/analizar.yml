name: Analizar horas

on:
  workflow_dispatch:
    inputs:
      horas:
        description: "Horas UTC separadas por espacio (AAAA-MM-DDTHH:MM)"
        required: true

permissions:
  contents: read

jobs:
  analizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Analizar
        run: python procesar.py --analisis ${{ inputs.horas }}
      - uses: actions/upload-artifact@v4
        with:
          name: analisis
          path: analisis/
