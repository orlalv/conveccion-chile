name: Probar URL
on:
  workflow_dispatch:
    inputs:
      url: {description: "URL", required: true}
      buscar: {description: "texto a buscar", required: false, default: ""}
      mostrar: {description: "imprimir la respuesta completa (si/no)", required: false, default: "no"}
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -w "tiempo %{time_total}s\n" -D h.txt -o r.txt "${{ inputs.url }}"; grep -iE "^HTTP|cache|etag|age:|cf-" h.txt; wc -c r.txt
          if [ "${{ inputs.mostrar }}" = "si" ]; then echo "=====INICIO"; cat r.txt; echo; echo "=====FIN"; fi
          if [ -n "${{ inputs.buscar }}" ]; then grep -o "${{ inputs.buscar }}.\{0,80\}" r.txt | head -5; fi
      - uses: actions/upload-artifact@v4
        with: {name: respuesta, path: r.txt}
