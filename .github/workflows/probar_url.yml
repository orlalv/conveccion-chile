name: Probar URL
on:
  workflow_dispatch:
    inputs:
      url: {description: "URL", required: true}
      buscar: {description: "texto a buscar", required: false, default: ""}
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -w "tiempo %{time_total}s\n" -D h.txt -o r.txt "${{ inputs.url }}"; grep -iE "^HTTP|cache|etag|age:|cf-" h.txt; wc -c r.txt
          if [ -n "${{ inputs.buscar }}" ]; then grep -o "${{ inputs.buscar }}.\{0,80\}" r.txt | head -5; fi
