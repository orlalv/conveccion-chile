name: Actualizar visor

# Funciona en cadena: cada ejecución procesa la imagen más reciente, publica la página,
# espera hasta completar ~10 minutos y deja lanzada la siguiente.
# El horario (cron) es solo un respaldo para reiniciar la cadena si alguna vez se corta.

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: visor
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Anotar hora de inicio
        run: echo "INICIO=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar librerías
        run: pip install -r requirements.txt

      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Procesar imagen del GOES-19
        env:
          SITIO_URL: ${{ steps.pages.outputs.base_url }}
        run: python procesar.py

      - name: Copiar límites geográficos
        run: mkdir -p site/geo && cp geo/*.geojson site/geo/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Programar la siguiente ejecución
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # La NOAA publica cada imagen ~10 min después de que empieza el barrido (:00, :10, :20…).
          # Se espera hasta el próximo minuto terminado en 1 (más 20 s) para tomar la imagen apenas aparece.
          ahora=$(date +%s)
          objetivo=$(( (ahora / 600 + 1) * 600 + 80 ))
          if [ $(( objetivo - ahora )) -lt 240 ]; then objetivo=$(( objetivo + 600 )); fi
          espera=$(( objetivo - ahora - 30 ))
          echo "Esperando $espera s"; sleep $espera
          # ¿ya hay otra ejecución esperando? entonces no se lanza una más
          en_cola=$(gh run list -R "$GITHUB_REPOSITORY" -w actualizar.yml -s queued --json databaseId -q 'length')
          pendiente=$(gh run list -R "$GITHUB_REPOSITORY" -w actualizar.yml -s pending --json databaseId -q 'length')
          if [ "$en_cola" != "0" ] || [ "$pendiente" != "0" ]; then echo "Ya hay una ejecución en cola."; exit 0; fi
          gh workflow run actualizar.yml -R "$GITHUB_REPOSITORY" --ref main
          echo "Siguiente ejecución lanzada."
